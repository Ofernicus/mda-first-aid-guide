<div id="metronome" class="section">
            <h2>מטרונום להחייאה</h2>
            <p>קצב מומלץ לעיסויים: 100–120 בדקה. בחר קצב והפעל.</p>
            <div style="text-align: center; margin: 2rem 0;">
                <label for="bpm">קצב (BPM): <span id="bpm-value">110</span></label><br>
                <input type="range" id="bpm" min="100" max="120" value="110" style="width: 80%; max-width: 300px; margin: 1rem 0;">
                <br>
                <button id="metro-toggle" style="background: var(--mda-red); color: white; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">הפעל מטרונום</button>
                <div id="metro-indicator" style="margin-top: 1.5rem; font-size: 3rem; height: 60px; line-height: 60px;">●</div>
            </div>
            <div class="note">המטרונום מפיק צליל קצר בכל פעימה. השתמש באוזניות או ווליום מתאים בסביבה רועשת.</div>
        </div>
