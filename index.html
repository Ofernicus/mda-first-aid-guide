<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ובא לציון גואל</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ambulance-svg { width: 48px; height: 48px; vertical-align: middle; }
        header { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0.5rem; }
    </style>
</head>
<body>
    <header>
        <!-- אמבולנס שמאל – מגן דוד אדום -->
        <svg class="ambulance-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="20" width="40" height="24" rx="3" fill="#DC0814"/>
            <rect x="44" y="28" width="14" height="12" rx="2" fill="#DC0814"/>
            <circle cx="16" cy="48" r="5" fill="#333"/>
            <circle cx="40" cy="48" r="5" fill="#333"/>
            <rect x="12" y="24" width="10" height="8" rx="1" fill="white"/>
            <!-- מגן דוד -->
            <polygon points="17,25.5 19.5,29.5 14.5,29.5" fill="#DC0814"/>
            <polygon points="17,30.5 19.5,26.5 14.5,26.5" fill="#DC0814"/>
        </svg>
        <h1>ובא לציון גואל</h1>
        <!-- אמבולנס ימין -->
        <svg class="ambulance-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1);">
            <rect x="4" y="20" width="40" height="24" rx="3" fill="#DC0814"/>
            <rect x="44" y="28" width="14" height="12" rx="2" fill="#DC0814"/>
            <circle cx="16" cy="48" r="5" fill="#333"/>
            <circle cx="40" cy="48" r="5" fill="#333"/>
            <rect x="12" y="24" width="10" height="8" rx="1" fill="white"/>
            <!-- מגן דוד -->
            <polygon points="17,25.5 19.5,29.5 14.5,29.5" fill="#DC0814"/>
            <polygon points="17,30.5 19.5,26.5 14.5,26.5" fill="#DC0814"/>
        </svg>
    </header>

    <div class="search-bar">
        <input type="text" id="search" placeholder="חיפוש מהיר בנושאים (החייאה, חנק, אלרגיה, חמצן...)">
    </div>

    <nav class="topics" id="topics-nav">
        <div class="topic-card" data-section="call" title="חיוג למוקד (101)">📞</div>
        <div class="topic-card" data-section="bls" title="החייאה בסיסית (BLS)">💓</div>
        <div class="topic-card" data-section="airway" title="נתיב אוויר וחנק">🗣️</div>
        <div class="topic-card" data-section="avoid" title="הימנעות מהחייאה">🚫</div>
        <div class="topic-card" data-section="oxygen" title="חמצן">💨</div>
        <div class="topic-card" data-section="nervous" title="מערכת העצבים">🧠</div>
        <div class="topic-card" data-section="seizures" title="פרכוסים">⚡</div>
        <div class="topic-card" data-section="respiratory" title="מערכת הנשימה">🫁</div>
        <div class="topic-card" data-section="anamnesis" title="אנמנזה">📋</div>
        <div class="topic-card" data-section="resp-emerg" title="מצבי חירום נשימתיים">🚨</div>
        <div class="topic-card" data-section="allergy" title="אלרגיה ואנפילקסיס">⚠️</div>
        <div class="topic-card" data-section="poisons" title="רעלים והרעלות">☠️</div>
        <div class="topic-card" data-section="numbers" title="מספרים לזכור">🔢</div>
        <div class="topic-card" data-section="metronome" title="מטרונום">⏱️</div>
    </nav>

    <main id="content">
        <!-- Content loaded dynamically -->
    </main>

    <footer>
        <p>המידע מיועד להכוונה ולרענון. תמיד פעלו לפי ההנחיות העדכניות של מד"א והמוקד הרפואי.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
